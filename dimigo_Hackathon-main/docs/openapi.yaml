openapi: 3.1.0
info:
  title: 시로 서비스 API
  version: 1.0.0-draft
  description: 2026-10-24 요구사항 기반 구현 전 제안 명세. 앱/모바일 웹 공용 API. 내부 결제 없음. 식당 확인이 주문 수락 및 수수료 근거 기준이다. x-policy-status=provisional은
    임시 정책. 상세 상태 흐름·정책은 시로_API_명세서_v1.md 참조. 모든 날짜는 UTC, 금액은 KRW 정수.
servers:
- url: /api/v1
  description: 배포 호스트 기준 상대 경로; 운영 도메인 미정
security:
- bearerAuth: []
tags:
- name: 인증
- name: 기준 정보
- name: 식사 제한
- name: 파티
- name: 초대·참가자
- name: 카테고리 검토
- name: 식당 검토
- name: 작업
- name: QR 연결
- name: 주문
- name: 사업자 매장
- name: 사업자 메뉴
- name: 사업자 QR
- name: 사업자 주문
- name: 수수료
- name: 실시간
paths:
  /auth/login:
    post:
      operationId: login
      summary: 인증 코드로 로그인
      tags:
      - 인증
      description: 배포에서 허용된 공급자의 코드를 검증한다. redirectUri 허용 목록, PKCE·state·nonce는 인증 연동에서 검증한다. 공급자 목록은 미정.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
      x-policy-status: provisional
  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: 사용자 토큰 회전
      tags:
      - 인증
      description: 본문의 refreshToken으로 인증하고 이전 refreshToken을 폐기한다. 게스트 refresh는 제공하지 않는다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security: []
  /auth/logout:
    post:
      operationId: logout
      summary: 사용자 세션 종료
      tags:
      - 인증
      description: 인증 주체 소유의 refreshToken을 폐기한다. 이미 폐기된 동일 토큰에도 204. accessToken 세션도 무효화한다.
      responses:
        '204':
          description: 성공
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /me:
    get:
      operationId: getMe
      summary: 본인 정보 조회
      tags:
      - 인증
      description: 모든 인증 주체. 다른 사용자 조회 경로는 제공하지 않는다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /guest-sessions:
    post:
      operationId: createPartyGuestSession
      summary: 초대 게스트 생성 및 파티 입장
      tags:
      - 인증
      description: 유효 초대와 WAITING·정원을 검증하고 게스트 및 멤버를 함께 생성한다. 별도 join 불필요. 해당 파티만 접근. 종료 또는 발급 후 24시간에 만료.
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSession'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSessionRequest'
      security: []
      x-policy-status: provisional
  /food-categories:
    get:
      operationId: listFoodCategories
      summary: 음식 카테고리 코드 목록
      tags:
      - 기준 정보
      description: 음식 카테고리 코드 목록
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodePage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      x-policy-status: provisional
  /ingredients:
    get:
      operationId: listIngredients
      summary: 재료 코드 목록
      tags:
      - 기준 정보
      description: 재료 코드 목록
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodePage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      x-policy-status: provisional
  /restriction-targets:
    get:
      operationId: listRestrictionTargets
      summary: 식사 제한 대상 코드 목록
      tags:
      - 기준 정보
      description: 식사 제한 대상 코드 목록
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionTargetPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      x-policy-status: provisional
  /me/dietary-restrictions:
    get:
      operationId: getDietaryRestrictions
      summary: 본인 식사 제한 조회
      tags:
      - 식사 제한
      description: 본인만 접근. 사용자 또는 게스트. 수정은 제한 collection revision의 If-Match 사용. WAITING 파티의 확인을 해제하고 진행 중 파티 제한
        스냅샷은 유지한다. QR_GUEST의 DRAFT 주문 제한 변경은 본인 메뉴 완료를 해제하고 Order version을 증가시킨다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionCollection'
          headers:
            ETag:
              description: 인용부호로 감싼 Party/Order/제한 revision. 복합 응답은 작업 대상 버전.
              schema:
                type: string
              example: '"4"'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    put:
      operationId: replaceDietaryRestrictions
      summary: 식사 제한 전체 교체
      tags:
      - 식사 제한
      description: 본인만 접근. 사용자 또는 게스트. 수정은 제한 collection revision의 If-Match 사용. WAITING 파티의 확인을 해제하고 진행 중 파티 제한
        스냅샷은 유지한다. QR_GUEST의 DRAFT 주문 제한 변경은 본인 메뉴 완료를 해제하고 Order version을 증가시킨다. targetCode 중복은 422.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionCollection'
          headers:
            ETag:
              description: 인용부호로 감싼 Party/Order/제한 revision. 복합 응답은 작업 대상 버전.
              schema:
                type: string
              example: '"4"'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRestrictionsRequest'
      x-policy-status: provisional
    post:
      operationId: addDietaryRestriction
      summary: 식사 제한 추가
      tags:
      - 식사 제한
      description: 본인만 접근. 사용자 또는 게스트. 수정은 제한 collection revision의 If-Match 사용. WAITING 파티의 확인을 해제하고 진행 중 파티 제한
        스냅샷은 유지한다. QR_GUEST의 DRAFT 주문 제한 변경은 본인 메뉴 완료를 해제하고 Order version을 증가시킨다. 같은 type/targetCode 중복은 409.
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionCollection'
          headers:
            ETag:
              description: 인용부호로 감싼 Party/Order/제한 revision. 복합 응답은 작업 대상 버전.
              schema:
                type: string
              example: '"4"'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestrictionInput'
  /me/dietary-restrictions/{restrictionId}:
    delete:
      operationId: deleteDietaryRestriction
      summary: 본인 제한 삭제
      tags:
      - 식사 제한
      description: 본인만 접근. 사용자 또는 게스트. 수정은 제한 collection revision의 If-Match 사용. WAITING 파티의 확인을 해제하고 진행 중 파티 제한
        스냅샷은 유지한다. QR_GUEST의 DRAFT 주문 제한 변경은 본인 메뉴 완료를 해제하고 Order version을 증가시킨다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionCollection'
          headers:
            ETag:
              description: 인용부호로 감싼 Party/Order/제한 revision. 복합 응답은 작업 대상 버전.
              schema:
                type: string
              example: '"4"'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: restrictionId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - $ref: '#/components/parameters/IfMatch'
  /parties:
    post:
      operationId: createParty
      summary: 파티 생성
      tags:
      - 파티
      description: USER만 생성. 생성자를 HOST 멤버로 등록하고 WAITING 반환. 제한 확인은 별도 수행.
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
          headers:
            ETag:
              description: 인용부호로 감싼 Party/Order/제한 revision. 복합 응답은 작업 대상 버전.
              schema:
                type: string
              example: '"4"'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyRequest'
  /parties/{partyId}:
    get:
      operationId: getParty
      summary: 파티 상태 스냅샷
      tags:
      - 파티
      description: 해당 파티 참가자. 멤버·후보 집합 메타데이터와 현재 주문 ID를 반환한다. 개인 후보 플래그는 후보 목록을 별도 조회한다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
          headers:
            ETag:
              description: 인용부호로 감싼 Party/Order/제한 revision. 복합 응답은 작업 대상 버전.
              schema:
                type: string
              example: '"4"'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: partyId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    patch:
      operationId: updateParty
      summary: 파티 조건 수정
      tags:
      - 파티
      description: 방장, WAITING에서만 가능. Party version 사용.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
          headers:
            ETag:
              description: 인용부호로 감싼 Party/Order/제한 revision. 복합 응답은 작업 대상 버전.
              schema:
                type: string
              example: '"4"'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: partyId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartyRequest'
    delete:
      operationId: cancelParty
      summary: 파티 취소
      tags:
      - 파티
      description: 방장, 제출 전 WAITING~ORDERING에서만 가능. Party version. 논리 취소하며 DRAFT 주문과 진행 중 Job도 취소한다.
      responses:
        '204':
          description: 성공
          headers:
            ETag:
              description: 인용부호로 감싼 Party/Order/제한 revision. 복합 응답은 작업 대상 버전.
              schema:
                type: string
              example: '"4"'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
