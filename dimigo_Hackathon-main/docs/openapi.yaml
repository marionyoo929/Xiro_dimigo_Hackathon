      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    LastEventId:
      name: Last-Event-ID
      in: header
      schema:
        type: string
      description: 재연결할 스트림의 마지막 eventId. 보관 만료 시 409 EVENT_CURSOR_EXPIRED.
  responses:
    Error:
      description: 공통 오류. HTTP 코드 및 error.code는 Markdown 오류 규약 참조.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
