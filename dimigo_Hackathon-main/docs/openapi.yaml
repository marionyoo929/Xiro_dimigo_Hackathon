        type: string
        minLength: 16
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 인용부호로 감싼 버전. Party/Order/제한 revision 중 작업 설명의 기준을 사용한다.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      example: '"3"'
    Cursor:
