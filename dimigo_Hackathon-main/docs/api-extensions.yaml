openapi: 3.1.0
info:
  title: 시로 구현 추가 계약
  version: 1.0.0
  description: 원본 80개 작업은 openapi.yaml을 유지한다. 아래는 이번 구현에 추가한 소비자 미리보기와 선택형 로컬 인증이다.
servers:
  - url: /api/v1
paths:
  /restaurants/nearby-count:
    get:
      summary: 등록 식당 반경별 개수 미리보기
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: searchRadiusMeters, in: query, required: true, schema: { type: integer, minimum: 200, maximum: 1000 } }
      responses:
        '200':
          description: 예산·판매 메뉴를 적용하기 전 등록 식당 수. 중복 없이 실제 직선거리를 계산한다.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [count, searchRadiusMeters]
                properties:
                  count: { type: integer, minimum: 0 }
                  searchRadiusMeters: { type: integer, minimum: 200, maximum: 1000 }
  /auth/local-codes:
    post:
      summary: 운영자 발급 로컬 계정의 비밀번호 검증과 단일 사용 코드 발급
      description: LOCAL_AUTH_ENABLED=true일 때만 설치. 공개 계정/사업자 생성은 제공하지 않음. 정확히 PUBLIC_ORIGIN/인 redirectUri만 허용. 코드 60초, 한 번만 사용. 이후 provider=local로 /auth/login 호출.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, redirectUri]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 256 }
                redirectUri: { type: string, format: uri }
      responses:
        '200':
          description: 로그인 코드
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authorizationCode]
                properties:
                  authorizationCode: { type: string }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
